name: Update README Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate-readme-cards:
    name: Generate GitHub Profile Cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=abbasi303&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true"
          path: profile/stats-v2.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate languages across projects card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=abbasi303&layout=compact&theme=github_dark&hide_border=true&langs_count=8&size_weight=0&count_weight=1&custom_title=Languages%20Across%20My%20Projects"
          path: profile/languages-v2.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats-v2.svg
          git add profile/languages-v2.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update GitHub profile cards"
            git push
          fi
