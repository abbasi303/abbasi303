name: Update README Cards

on:
  workflow_dispatch:

  schedule:
    # Run every day at 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate-readme-cards:
    name: Generate GitHub Profile Cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # -------------------------------------------------------
      # 1. Checkout profile repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. Make sure output directory exists
      # -------------------------------------------------------
      - name: Create profile directory
        run: mkdir -p profile

      # -------------------------------------------------------
      # 3. Generate main GitHub statistics card
      # -------------------------------------------------------
      - name: Generate GitHub stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=abbasi303
            &show_icons=true
            &theme=github_dark
            &hide_border=true
            &include_all_commits=true
            &count_private=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      # -------------------------------------------------------
      # 4. Generate programming languages card
      #
      # size_weight=0.5:
      #   considers how much code exists in each language
      #
      # count_weight=0.5:
      #   considers how many repositories use each language
      #
      # This avoids one very large HTML repository dominating
      # the entire language distribution.
      # -------------------------------------------------------
      - name: Generate languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >-
            username=abbasi303
            &layout=compact
            &theme=github_dark
            &hide_border=true
            &langs_count=8
            &size_weight=0.5
            &count_weight=0.5
            &custom_title=Languages%20Across%20My%20Projects
          path: profile/languages.svg
          token: ${{ secrets.PAT_TOKEN }}

      # -------------------------------------------------------
      # 5. Commit generated cards back to repository
      # -------------------------------------------------------
      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/languages.svg

          if git diff --cached --quiet; then
            echo "No changes detected. Nothing to commit."
          else
            git commit -m "Update GitHub profile statistics"
            git push
          fi
