name: Update README Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # GitHub statistics
      # -------------------------------------------------------
      - name: Generate GitHub stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=abbasi303&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true"
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      # -------------------------------------------------------
      # Programming languages
      #
      # 0.5 size + 0.5 repository count prevents a single large
      # HTML repository from dominating the entire card.
      # -------------------------------------------------------
      - name: Generate languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=abbasi303&layout=compact&theme=github_dark&hide_border=true&langs_count=8&size_weight=0.5&count_weight=0.5&custom_title=Languages%20Across%20My%20Projects"
          path: profile/languages.svg
          token: ${{ secrets.PAT_TOKEN }}

      # -------------------------------------------------------
      # Commit newly generated SVG cards
      # -------------------------------------------------------
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/languages.svg

          if git diff --cached --quiet; then
            echo "No card changes to commit."
          else
            git commit -m "Update GitHub profile statistics"
            git push
          fi
